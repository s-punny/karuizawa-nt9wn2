<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Shippori+Mincho+B1:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="robots" content="noindex, nofollow">
<!-- OGP 画像（images/ogp-1.jpg）の版下。ページ本体ではない。
     1200x630 で表示してスクリーンショットを撮ると書き出せる。 -->
<style>
  :root{ --ink:#3b3330; --ink-soft:#6b5f5a; --paper:#faf7f4; --accent:#96706a; --accent-lt:#c6a49c;
         --mincho:"Shippori Mincho B1",serif; --en:"Cormorant Garamond",serif; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  /* 写真と文字をひとかたまりとして中央に置く。左揃えだと
     文字ブロックの幅のぶんだけ右に余白が残り、左に寄って見える */
  body{ width:1200px; height:630px; background:var(--paper); color:var(--ink);
        display:flex; align-items:center; justify-content:center; gap:72px; padding:64px 76px;
        font-family:var(--mincho); -webkit-font-smoothing:antialiased; }
  .ph{ width:502px; height:502px; flex:none; overflow:hidden; border-radius:4px;
       box-shadow:0 34px 60px -34px rgba(70,52,48,.42); }
  .ph img{ width:100%; height:100%; object-fit:cover; display:block; }
  .lbl{ font-family:var(--en); font-weight:500; font-size:17px; letter-spacing:.5em;
        text-transform:uppercase; color:var(--accent); }
  .date{ font-family:var(--en); font-size:27px; letter-spacing:.42em; color:var(--ink-soft); margin-top:34px; }
  .rule{ width:40px; height:1px; background:var(--accent-lt); margin:24px 0 0; }
  .names{ font-family:var(--en); font-weight:300; font-size:76px; line-height:1.1;
          letter-spacing:.02em; margin-top:22px; }
  .names i{ font-style:italic; font-size:.42em; color:var(--accent); margin-right:.34em; vertical-align:.12em; }
  .jp{ font-size:21px; font-weight:500; letter-spacing:.3em; margin-top:26px; }
  .place{ font-size:17px; letter-spacing:.26em; color:var(--ink-soft); margin-top:12px; }
</style></head><body>
  <div class="ph"><img src="images/cover-bouquet-3.jpg" alt=""></div>
  <div>
    <div class="lbl">Wedding Invitation</div>
    <div class="date">2026 . 10 . 16</div>
    <div class="rule"></div>
    <div class="names">Shusaku<br><i>and</i>Chihiro</div>
    <div class="jp">本藤 周作　・　本藤 ちひろ</div>
    <div class="place">矢ケ崎チャペル　／　軽井沢</div>
  </div>
</body></html>
